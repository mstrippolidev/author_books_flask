name: Docker push job
on:
  push:
    branches:
      - main
jobs:
  run-test:
    runs-on: ubuntu-latest
    environment: MAIN
    steps:
      - name: run test
        run: echo "running test (checkout and run test to db test)"
      
      - name: check values
        run: echo ${{ secrets.DOCKER_USERNAME }}
  
  build-push-docker-image:
    runs-on: ubuntu-latest
    environment: MAIN
    needs: [run-test]
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        # Recommended by actions build-push
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker_files/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flask_app_distributed:latest
            ${{ secrets.DOCKER_USERNAME }}/flask_app_distributed:${{ github.sha }}
      
      - name: Log out from Docker Hub
        run: docker logout