apiVersion: v1
kind: Service
metadata:
  name: &cluster_name cluster-db-ha # assing the value cluster-db-ha to cluster_name anchor
  labels:
    application: patroni
    cluster-name: *cluster_name
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1 # Same cluster ip but for replica
kind: Service
metadata:
  name: patronidemo-repl
  labels:
    application: patroni
    cluster-name:  &cluster_name cluster-db-ha
    role: replica
spec:
  type: ClusterIP
  selector:
    application: patroni
    cluster-name: *cluster_name
    role: replica
  ports:
  - port: 5432
    targetPort: 5432