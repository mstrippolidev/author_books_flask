apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-app-ingress
  namespace: default
spec:
  ingressClassName: nginx # required by new versions of k8s
  rules:
    - host: a44090bce547b4f12b46907fa6464cc1-1744562305.us-east-1.elb.amazonaws.com  # external ip load balancer
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-app-cluster-ip-service
                port:
                  number: 80