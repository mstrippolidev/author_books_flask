apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      component: postgres
  template:
    metadata:
      labels:
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          ports:
          - containerPort: 5432
          env: # Changes this for secrets later
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets-flask-app
                  key: DB_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: secrets-flask-app
                  key: DB_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: secrets-flask-app
                  key: DB_NAME
          volumeMounts: # Mount the data in this filesystem (like binding to the PVC)
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-volumes
          PersistentVolumeClaim:
            claimName: postgres-pvc # Name of my pvcClaim file
      nodeSelector: # To be selected by my eks role tag
        role: db