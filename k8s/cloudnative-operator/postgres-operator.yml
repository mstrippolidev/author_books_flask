apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-db-cluster
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:14.12
  storage:
    size: 5Gi
    storageClass: "gp2"

  # tell to backup
  bootstrap:
  #   recovery: I you have a bartman object in s3 or another cloud provider
  #     source: s3-restore-source # A name for the source config below
  #     database: flask_db_1
    # with the database and also the owner, and credentials
    initdb:
      # This creates the database 'flask_db_1' 
      database: flask_db_1
      # import: # Migrate the data from previous db
      #   type: microservice # Required, tell that is one db
      #   databases:
      #     - flask_db_1
      #   source:
      #     externalCluster: my-windows

  backup:
    barmanObjectStore:
      destinationPath: s3://ms-petsland-1/backups/
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: s3-credentials
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip


  # Define the external S3 backup source
  # externalClusters:
  #   - name: my-windows
  #     connectionParameters:
  #       # Use the correct IP or host name for the source database
  #       host: 172.31.240.1
  #       user: postgres
  #       port: 5433
  #       dbname: postgres
  #     password:
  #       name: s3-credentials
  #       key: DB_PASSWORD
    # - name: s3-restore-source # Must match the source name above
    #   barmanObjectStore:
    #     destinationPath: "s3://ms-petsland-1/backups/" # Path to your backups folder in your bucket
    #     s3Credentials:
    #       # Link to the secret you created
    #       accessKeyId:
    #         name: s3-credentials
    #         key: AWS_ACCESS_KEY_ID
    #       secretAccessKey:
    #         name: s3-credentials
    #         key: AWS_SECRET_ACCESS_KEY

  # PostgreSQL configuration settings
  # postgresql:
  #   parameters: # We can change anything from here
  #     max_connections: '200'
  #     shared_buffers: '256MB'

  # Enable monitoring with the default Prometheus exporter
  # monitoring:
  #   enablePodMonitor: true